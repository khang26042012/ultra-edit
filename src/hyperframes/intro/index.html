<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0" />
    <title>Ultra Edit — HyperFrames Intro</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(circle at 30% 25%, #0f172a 0%, #020617 75%);
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .glow {
        position: absolute;
        width: 720px;
        height: 720px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.45), rgba(34, 211, 238, 0.08) 60%, transparent 72%);
        filter: blur(40px);
      }
      .badge {
        font-size: 24px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #38bdf8;
        margin-bottom: 24px;
        opacity: 0;
      }
      .title {
        font-size: 132px;
        font-weight: 900;
        letter-spacing: 0.1em;
        background: linear-gradient(90deg, #ffffff, #a5b4fc, #38bdf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        opacity: 0;
      }
      .subtitle {
        margin-top: 28px;
        font-size: 34px;
        color: #cbd5e1;
        letter-spacing: 0.04em;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="intro" data-width="1920" data-height="1080" data-fps="30" data-duration="5">
      <div class="stage" data-start="0" data-duration="5">
        <div class="glow"></div>
        <div class="badge">HyperFrames + GSAP Studio</div>
        <h1 class="title">ULTRA EDIT</h1>
        <p class="subtitle">HTML • CSS • GSAP • Three.js • Remotion</p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".glow", { scale: 0.5, opacity: 0 }, { scale: 1.25, opacity: 1, duration: 2.2, ease: "power2.out" }, 0);
      tl.fromTo(".badge", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.3);
      tl.fromTo(".title", { y: 50, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 1.1, ease: "expo.out" }, 0.6);
      tl.fromTo(".subtitle", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: "power2.out" }, 1.2);
      tl.to(".glow", { scale: 1.4, opacity: 0.75, duration: 2.0, ease: "sine.inOut" }, 2.4);

      // Expose seek hook for deterministic frame capture
      window.__seek = (timeSec) => {
        tl.seek(timeSec, false);
      };
      if (!window.__HYPERFRAMES__) {
        tl.play();
      }
    </script>
  </body>
</html>
